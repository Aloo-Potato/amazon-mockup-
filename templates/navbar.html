{% load static %}
<header>
    <div class="logo">
        <div class="brand-logo">amazon<span>.in</span></div>
    </div>

    <div class="location">
        <div class="location-pin">
            <i class="fa-solid fa-location-dot"></i>
        </div>
        <div class="location-text">
            <div class="delivering">Delivering to New Delhi 110005</div>
            <div class="update">Update location</div>
        </div>
    </div>

    <div class="dropdown">
        <select>
            <option>All</option>
            <option>Electronics</option>
            <option>Books</option>
            <option>Fashion</option>
        </select>
        <input type="text" class="search_box" aria-label="Search">
        <div class="search_icon">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </div>

    <div class="language">
        <select>
            <option>🇮🇳 EN</option>
            <option>🇬🇧 EN</option>
            <option>🇺🇸 EN</option>
        </select>
    </div>

    <div class="account">
        <div class="sign_in">
            <p>Hello, sign-in</p>
            <strong>Account &amp; Lists</strong>
        </div>
        <div class="order">
            <p>Returns</p>
            <strong>&amp; Orders</strong>
        </div>
        <div class="cart_icon">
            <div class="cart_count">0</div>
            <div class="cart_emoji">🛒</div>
            <div class="cart_text">Cart</div>
        </div>
    </div>
</header>
